server {
    server_name metropolitain.live www.metropolitain.live;

    location / {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/metropolitain.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/metropolitain.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name api.metropolitain.live;

    client_max_body_size 1m;
    proxy_connect_timeout 30s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # WebSocket upgrade — proxy_params alone doesn't carry the Upgrade/Connection
    # headers the live-positions feed needs.
    location /ws {
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/proxy_params;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/metropolitain.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/metropolitain.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.metropolitain.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = metropolitain.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name metropolitain.live www.metropolitain.live;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot




}

server {
    if ($host = api.metropolitain.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name api.metropolitain.live;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}