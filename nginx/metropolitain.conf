# Per-IP request/connection throttling — cheap insurance against a single client (or
# bot) flooding the site or the API with no throttle at all. Zone names are prefixed to
# avoid colliding with fernpair's own zones sharing this same nginx instance.
limit_req_zone $binary_remote_addr zone=metropolitain_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=metropolitain_api:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=metropolitain_conn:10m;

# Baseline security headers, applied to both vhosts below. No Content-Security-Policy
# yet — the app pulls MapLibre tiles, an OpenFreeMap style, and a Cloudflare analytics
# beacon, and a wrong CSP would silently break map rendering; needs its own careful pass
# against the exact set of external origins in use, not a blind default here.

server {
    server_name metropolitain.live www.metropolitain.live;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        limit_req zone=metropolitain_general burst=40 nodelay;
        limit_conn metropolitain_conn 20;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/metropolitain.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/metropolitain.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name api.metropolitain.live;

    client_max_body_size 1m;
    proxy_connect_timeout 30s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # WebSocket upgrade — proxy_params alone doesn't carry the Upgrade/Connection
    # headers the live-positions feed needs. limit_req doesn't apply well to a single
    # long-lived upgrade request; limit_conn instead caps how many concurrent
    # connections one IP can hold open, so no single client can exhaust connection slots.
    location /ws {
        limit_conn metropolitain_conn 10;
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        limit_req zone=metropolitain_api burst=30 nodelay;
        limit_conn metropolitain_conn 20;
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/proxy_params;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/metropolitain.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/metropolitain.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.metropolitain.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = metropolitain.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name metropolitain.live www.metropolitain.live;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot




}

server {
    if ($host = api.metropolitain.live) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name api.metropolitain.live;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}